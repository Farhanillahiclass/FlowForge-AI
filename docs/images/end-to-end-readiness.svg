<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">FlowForge-AI end-to-end workflow lifecycle</title><desc id="desc">A safe deployment path from import through configuration, parent-child binding, validation, positive and negative tests, destination verification and controlled activation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><rect width="1400" height="600" rx="26" fill="url(#bg)"/><text x="65" y="70" fill="#f8fafc" font-family="Inter,Arial" font-size="32" font-weight="700">End-to-End Readiness Path</text><text x="65" y="105" fill="#cbd5e1" font-family="Inter,Arial" font-size="17">A workflow is production-ready only after every gate is verified in the target n8n workspace.</text>
<g font-family="Inter,Arial"><g><rect x="65" y="170" width="260" height="118" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="195" y="205" text-anchor="middle" fill="#bae6fd" font-size="16">01</text><text x="195" y="235" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Import</text><text x="195" y="262" text-anchor="middle" fill="#cbd5e1" font-size="14">20 children + 3 system files</text></g>
<path d="M325 229 H365" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="375" y="170" width="260" height="118" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="505" y="205" text-anchor="middle" fill="#c7d2fe" font-size="16">02</text><text x="505" y="235" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Configure</text><text x="505" y="262" text-anchor="middle" fill="#cbd5e1" font-size="14">Credentials + placeholders</text></g>
<path d="M635 229 H675" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="685" y="170" width="260" height="118" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="815" y="205" text-anchor="middle" fill="#c7d2fe" font-size="16">03</text><text x="815" y="235" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Bind Parent IDs</text><text x="815" y="262" text-anchor="middle" fill="#cbd5e1" font-size="14">20 routes + ingress → router</text></g>
<path d="M945 229 H985" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="995" y="170" width="340" height="118" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="1165" y="205" text-anchor="middle" fill="#a7f3d0" font-size="16">04</text><text x="1165" y="235" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Test Safely</text><text x="1165" y="262" text-anchor="middle" fill="#cbd5e1" font-size="14">Positive · invalid · retry · failure</text></g>
<path d="M1165 288 V340 H815 V370" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<g><rect x="685" y="380" width="260" height="105" rx="16" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="815" y="415" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="700">Verify Results</text><text x="815" y="443" text-anchor="middle" fill="#a5f3fc" font-size="14">Execution + destination evidence</text><text x="815" y="465" text-anchor="middle" fill="#a5f3fc" font-size="14">Record run ID and outcome</text></g>
<path d="M685 432 H635" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="375" y="380" width="260" height="105" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="505" y="415" text-anchor="middle" fill="#dcfce7" font-size="18" font-weight="700">Approve Activation</text><text x="505" y="443" text-anchor="middle" fill="#bbf7d0" font-size="14">Only passed, reviewed workflows</text><text x="505" y="465" text-anchor="middle" fill="#bbf7d0" font-size="14">Enable external effects deliberately</text></g>
<path d="M375 432 H325" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="65" y="380" width="260" height="105" rx="16" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="195" y="415" text-anchor="middle" fill="#ffe4e6" font-size="18" font-weight="700">If Any Test Fails</text><text x="195" y="443" text-anchor="middle" fill="#fecdd3" font-size="14">Keep inactive · fix · retest</text><text x="195" y="465" text-anchor="middle" fill="#fecdd3" font-size="14">Never report false success</text></g></g>
<text x="65" y="550" fill="#94a3b8" font-family="Inter,Arial" font-size="13">Static validation is a preflight check. Live acceptance requires the user's n8n Cloud workspace and provider credentials.</text></svg>