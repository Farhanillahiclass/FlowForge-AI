<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">FlowForge-AI system architecture</title><desc id="desc">External event flows through authenticated ingress, request validation and a router into one of twenty canonical business workflows, with a separate central error handler.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
<rect width="1400" height="980" rx="28" fill="url(#bg)"/><text x="70" y="72" fill="#f8fafc" font-family="Inter,Arial" font-size="34" font-weight="700">FlowForge-AI · System Architecture</text><text x="70" y="108" fill="#cbd5e1" font-family="Inter,Arial" font-size="18">20 canonical business workflows · n8n Cloud 2.x deployment model</text>
<rect x="500" y="145" width="400" height="78" rx="16" fill="#172554" stroke="#38bdf8" stroke-width="2"/><text x="700" y="178" fill="#e0f2fe" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700">External Event / API Caller</text><text x="700" y="202" fill="#bae6fd" text-anchor="middle" font-family="Inter,Arial" font-size="14">HTTPS + Header Auth + request envelope</text>
<path d="M700 223 V254" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="260" width="540" height="88" rx="16" fill="#0f766e" stroke="#5eead4" stroke-width="2"/><text x="700" y="295" fill="#f0fdfa" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700">00 · Main Ingress</text><text x="700" y="322" fill="#ccfbf1" text-anchor="middle" font-family="Inter,Arial" font-size="16">Authenticate · validate requestId/eventType/data</text>
<path d="M700 348 V379" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="385" width="540" height="88" rx="16" fill="#3730a3" stroke="#a5b4fc" stroke-width="2"/><text x="700" y="420" fill="#eef2ff" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700">01 · Request Processor</text><text x="700" y="447" fill="#c7d2fe" text-anchor="middle" font-family="Inter,Arial" font-size="16">Map eventType → exactly one canonical child</text>
<path d="M700 473 V507" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="535" fill="#e2e8f0" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="700">20 Canonical Child Workflows</text>
<g font-family="Inter,Arial" font-size="15" text-anchor="middle" fill="#f8fafc">
<g><rect x="65" y="560" width="290" height="58" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="210" y="584">01–05 · Sales &amp; Support</text><text x="210" y="604" fill="#94a3b8" font-size="12">Lead · scoring · email · inbox · tickets</text></g>
<g><rect x="385" y="560" width="290" height="58" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="530" y="584">06–10 · Handoff &amp; Operations</text><text x="530" y="604" fill="#94a3b8" font-size="12">FAQ · meetings · onboarding · invoices</text></g>
<g><rect x="705" y="560" width="290" height="58" rx="12" fill="#1e293b" stroke="#818cf8"/><text x="850" y="584">11–15 · Content &amp; Marketing</text><text x="850" y="604" fill="#94a3b8" font-size="12">Drafts · social · video · newsletter</text></g>
<g><rect x="1025" y="560" width="310" height="58" rx="12" fill="#1e293b" stroke="#818cf8"/><text x="1180" y="584">16–20 · Reporting &amp; Reliability</text><text x="1180" y="604" fill="#94a3b8" font-size="12">Reports · feedback · errors · API · Telegram</text></g></g>
<path d="M700 540 V548 H210 V560 M700 548 H530 V560 M700 548 H850 V560 M700 548 H1180 V560" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M700 618 V665" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="672" width="540" height="72" rx="16" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="700" y="702" fill="#ecfeff" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700">Structured Result + Destination Verification</text><text x="700" y="726" fill="#a5f3fc" text-anchor="middle" font-family="Inter,Arial" font-size="15">n8n execution history · provider-side evidence</text>
<path d="M970 426 H1115 V777" stroke="#fb7185" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="875" y="790" width="460" height="100" rx="16" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="1105" y="825" fill="#ffe4e6" text-anchor="middle" font-family="Inter,Arial" font-size="21" font-weight="700">90 · Central Error Handler</text><text x="1105" y="852" fill="#fecdd3" text-anchor="middle" font-family="Inter,Arial" font-size="15">Sanitized log + operator alert</text><text x="1105" y="873" fill="#fda4af" text-anchor="middle" font-family="Inter,Arial" font-size="12">Must be assigned in Workflow Settings</text>
<rect x="65" y="790" width="730" height="100" rx="16" fill="#111827" stroke="#475569"/><text x="95" y="824" fill="#f8fafc" font-family="Inter,Arial" font-size="18" font-weight="700">Deployment truth</text><text x="95" y="850" fill="#cbd5e1" font-family="Inter,Arial" font-size="15">Workflow IDs and credentials are workspace-specific. Exports stay inactive.</text><text x="95" y="873" fill="#cbd5e1" font-family="Inter,Arial" font-size="15">Static checks do not equal live n8n/provider tests.</text>
<text x="70" y="945" fill="#94a3b8" font-family="Inter,Arial" font-size="13">FlowForge-AI · Architecture visualization · Keep external side effects gated until acceptance tests pass</text></svg>