name: Deploy FlowForge-AI Gallery

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate gallery assets
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          css = Path("site/styles.css").read_text(encoding="utf-8")
          js = Path("site/app.js").read_text(encoding="utf-8")
          assert 'id="workflow-grid"' in html
          assert 'id="workflow-search"' in html
          assert "function render()" in js
          assert "prefers-reduced-motion" in css
          slugs = re.findall(r'slug:"([^"]+)"', js)
          assert len(slugs) == 20, f"Expected 20 workflow records, found {len(slugs)}"
          assert len(set(slugs)) == 20, "Duplicate workflow slugs detected"
          print("Gallery structure checks passed: 20 unique workflow records.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload gallery artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
